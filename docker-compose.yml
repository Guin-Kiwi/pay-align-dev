# TODO(PR #3 review): service is named api but docs/PROJECT.md says app; DATABASE_URL format follows Ayla's database recipe. Owner: person 4.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/payroll.db
    volumes:
      - ./data:/app/data
# TODO(PR #3 review): start src.app.infrastructure.web.app:app instead. Owner: person 4.
    command: ["uvicorn", "src.app.interfaces.main:app", "--host", "0.0.0.0", "--port", "8000"]