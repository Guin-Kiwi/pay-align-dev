# Human review required: changes need a code owner's approval (.github/CODEOWNERS).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payalign
          POSTGRES_PASSWORD: payalign
          POSTGRES_DB: payalign_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payalign"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://payalign:payalign@localhost:5432/payalign_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ${{ hashFiles('.python-version') != '' && '.python-version' || 'environments/python/.python-version' }}
          cache: pip
          cache-dependency-path: "**/requirements*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Check AI-SDLC lifecycle artefacts
        run: bash scripts/check-lifecycle.sh

      - name: Check whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=$(git hash-object -t tree /dev/null)
            fi
            git diff --check "$base" "$PUSH_AFTER_SHA"
          fi

      - name: Set up Node.js for UI tests
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run project tests
        run: bash scripts/test.sh

  advisory:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: PR advisory (warnings only, never blocks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: python3 scripts/pr_advisory.py "$BASE_SHA" "$HEAD_SHA" "$BRANCH"
