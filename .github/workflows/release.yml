# Human review required: changes need a code owner's approval (.github/CODEOWNERS).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish GitHub Release (only from a v* tag)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: payalign:${{ github.sha }}
      ARCHIVE_NAME: payalign-${{ github.sha }}-linux-amd64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ${{ hashFiles('.python-version') != '' && '.python-version' || 'environments/python/.python-version' }}
          cache: pip
          cache-dependency-path: "**/requirements*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Check AI-SDLC lifecycle artefacts
        run: bash scripts/check-lifecycle.sh

      - name: Check whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          # Explicit integration baseline; this does not check all historical whitespace issues.
          base=afc02245b7db19f0430456ef79e6988ee5dbc16b
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD

      - name: Set up Node.js for UI tests
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run project tests
        run: bash scripts/test.sh

      - name: Build linux/amd64 image
        run: docker build --platform linux/amd64 --tag "$IMAGE_NAME" .

      - name: Check image for local data and development files
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint python "$IMAGE_NAME" -c '
          from pathlib import Path
          import fnmatch
          import importlib.util
          root = Path("/app")
          allowed = {"src", "requirements.txt", "LICENSE", "data"}
          unexpected = {p.name for p in root.iterdir()} - allowed
          if unexpected:
              raise SystemExit("Unexpected image contents: " + ", ".join(sorted(unexpected)))
          for module in ("pytest", "httpx"):
              if importlib.util.find_spec(module) is not None:
                  raise SystemExit("Test dependency in runtime image: " + module)
          excluded = {
              ".git", ".github", ".devcontainer", ".vscode", ".venv",
              ".agents", ".claude", ".cursor", "docs", "skills", "scripts",
              "environments", "tests", "data", "venv", "env", "ENV",
              "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache",
              ".pyre", ".hypothesis", ".tox", ".nox", "htmlcov", "build",
              "dist", ".eggs", "pip-wheel-metadata", ".idea",
              ".aws", ".ssh", ".codex",
          }
          patterns = (
              ".env", ".env.*", ".envrc", "*.db", "*.db-*", "*.sqlite",
              "*.sqlite-*", "*.sqlite3", "*.sqlite3-*", "*.py[codz]",
              "*.log", ".coverage", ".coverage.*", "coverage.xml",
              "*.egg-info", ".DS_Store", "AGENTS.md", "CLAUDE.md",
              "CONTRIBUTING.md", "CITATION.cff", ".zenodo.json", "pytest.ini",
          )
          runtime_data = root / "data"
          if not runtime_data.is_dir() or any(runtime_data.iterdir()):
              raise SystemExit("Runtime data directory must exist and be empty")
          found = [str(p.relative_to(root)) for p in root.rglob("*")
                   if p != runtime_data and (p.name in excluded or any(
                       fnmatch.fnmatchcase(p.name, pattern) for pattern in patterns))]
          if found:
              raise SystemExit("Disallowed files in image: " + ", ".join(sorted(found)))
          for required in ("src/app/infrastructure/web/app.py", "requirements.txt", "LICENSE"):
              if not (root / required).is_file():
                  raise SystemExit("Required file missing: " + required)
          '

      - name: Verify container runtime and persistent setup
        timeout-minutes: 5
        run: TEST_DOCKER_IMAGE="$IMAGE_NAME" python -m pytest -q tests/e2e/test_docker_runtime.py

      - name: Save verified image archive
        shell: bash
        run: |
          set -euo pipefail
          docker image save "$IMAGE_NAME" | gzip > "$RUNNER_TEMP/$ARCHIVE_NAME"
          gzip --test "$RUNNER_TEMP/$ARCHIVE_NAME"

      - name: Upload verified image archive
        uses: actions/upload-artifact@v4
        with:
          name: payalign-image-linux-amd64
          path: ${{ runner.temp }}/${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          compression-level: 0

  publish:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified image archive
        uses: actions/download-artifact@v4
        with:
          name: payalign-image-linux-amd64
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*.tar.gz
          fail_on_unmatched_files: true

  deploy:
    needs: publish
    uses: ./.github/workflows/cd.yml
    secrets:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
