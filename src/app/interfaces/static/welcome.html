<!doctype html>
<html lang="en">
<head>

  <title>Welcome | PayAlign</title>
  <link rel="stylesheet" href="/setup-assets/setup.css?v=20261027-back">
  <style>
    .welcome-nav a { padding: .55rem .8rem; border: 1px solid #c7d1d8; border-radius: .35rem; color: #172b3a; text-decoration: none; }

    .welcome svg { width: 100%; height: auto; }
    @media (max-width: 36rem) { .welcome { grid-template-columns: 1fr; gap: .5rem; padding: 1.5rem; } .welcome svg { width: 8rem; } }
