<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | PayAlign</title>
  <link rel="stylesheet" href="/setup-assets/setup.css">
  <link rel="stylesheet" href="/setup-assets/login.css">
  <script src="/setup-assets/login.js" defer></script>
</head>
<body>
<main>
  <p class="brand">PayAlign</p>
  <h1>Log in</h1>
  <noscript><p>Please enable JavaScript to log in.</p></noscript>
  <p id="account-status" role="status" aria-live="polite"></p>
  <p id="account-error" role="alert" hidden></p>
  <div id="signed-in" hidden>
    <p id="signed-in-name"></p>
    <p><a id="continue-link" href="/setup">Continue to setup</a></p>
  </div>
  <div id="login-panel">
    <p>Log in with your email and password to manage your employment.</p>
    <form id="login-form" method="post" novalidate>
      <label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="username" required aria-describedby="login-email-error">
      <p id="login-email-error" class="field-error" role="alert"></p>
      <label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required aria-describedby="login-password-error">
      <p id="login-password-error" class="field-error" role="alert"></p>
      <div class="actions">
        <button id="login-submit" class="primary" type="submit" disabled>Log in</button>
      </div>
      <p id="login-status" role="status" aria-live="polite"></p>
      <p id="login-error" role="alert" hidden></p>
    </form>
    <p>No account yet? <button id="open-signup" class="secondary" type="button" disabled>Create an account</button></p>
    <dialog id="signup-dialog" aria-labelledby="signup-heading">
      <form id="signup-form" method="post" novalidate>
        <h2 id="signup-heading">Create an account</h2>
        <label for="signup-first-name">First name</label><input id="signup-first-name" name="first_name" type="text" autocomplete="given-name" required aria-describedby="signup-first-name-error">
        <p id="signup-first-name-error" class="field-error" role="alert"></p>
        <label for="signup-last-name">Last name</label><input id="signup-last-name" name="last_name" type="text" autocomplete="family-name" required aria-describedby="signup-last-name-error">
        <p id="signup-last-name-error" class="field-error" role="alert"></p>
        <label for="signup-email">Email</label><input id="signup-email" name="email" type="email" autocomplete="username" required aria-describedby="signup-email-error">
        <p id="signup-email-error" class="field-error" role="alert"></p>
        <label for="signup-password">Password</label><input id="signup-password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-requirements signup-password-error">
        <div id="password-requirements" class="requirements">
          <p>Your password needs:</p>
          <ul>
            <li id="requirement-length" data-met="false">at least 8 characters</li>
            <li id="requirement-number" data-met="false">a number</li>
            <li id="requirement-special" data-met="false">a special character (not a letter, number or space)</li>
          </ul>
        </div>
        <p id="signup-password-error" class="field-error" role="alert"></p>
        <div class="actions">
          <button id="signup-submit" class="primary" type="submit" disabled>Create account</button>
          <button id="signup-cancel" class="secondary" type="button">Cancel</button>
        </div>
        <p id="signup-status" role="status" aria-live="polite"></p>
        <p id="signup-error" role="alert" hidden></p>
      </form>
    </dialog>
  </div>
</main>
</body>
</html>
